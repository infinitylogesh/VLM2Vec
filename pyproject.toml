[project]
name = "vlm2vec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "decord>=0.6.0",
    "einops>=0.8.2",
    "hf-transfer>=0.1.9",
    "hjson>=3.1.0",
    "hnswlib>=0.8.0",
    "huggingface-hub>=0.36.2",
    "ninja>=1.13.0",
    "numpy==1.26.4",
    "opencv-contrib-python>=4.11.0.86",
    "opencv-python>=4.11.0.86",
    "packaging>=26.0",
    "peft>=0.18.1",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "py-cpuinfo>=9.0.0",
    "pytrec-eval>=0.5",
    "qwen-vl-utils[decord]==0.0.8",
    "ray>=2.54.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "timm>=1.0.26",
    "tqdm>=4.67.3",
    "transformers==5.6.2",
    "wandb>=0.25.1",
    "wheel>=0.46.3",
    "wrapt>=2.1.2",
    "torch==2.8.0+cu128",
    "torchvision==0.23.0+cu128",
    "torchaudio==2.8.0+cu128",
    "matplotlib>=3.10.9",
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" },
]

torchvision = [
  { index = "pytorch-cu128" }
]

torchaudio = [
  { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
